<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Almuerzos Caseros - Menú Diario</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts for rustic/friendly look -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&amp;family=Quicksand:wght@400;700&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'brand-brown': '#5D4037',
            'brand-orange': '#F57C00',
            'brand-cream': '#F3E5D8',
          },
          fontFamily: {
            'serif-bold': ['Fredoka', 'sans-serif'],
            'body': ['Quicksand', 'sans-serif'],
          }
        }
      }
    }
  </script>
<style data-purpose="custom-background">
/* Applying the textured paper background effect */
body {
    background-color: #f4eee1;
    background-image: url(assets/pastas.jpg);
    font-family: "Quicksand", sans-serif;
    object-fit: cover;
    background-size: cover;
    background-repeat:  no-repeat;
    background-image: radial-gradient(rgba(255, 255, 255, 0.3) 1px, transparent 1px), radial-gradient(rgba(255, 255, 255, 0.3) 1px, transparent 1px);        
    }
.title-shadow {
    text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.05)
    }</style>
</head>
<body class="min-h-screen text-brand-brown">
<!-- BEGIN: Hero Image Gallery -->
<header class="w-full overflow-hidden" data-purpose="hero-gallery">
<div class="grid grid-cols-3 gap-1 h-64 sm:h-80 md:h-96">
<!-- We use the provided full image and clip it via CSS to mimic the 3-column look or use it as a reference -->
<!-- Since only one image is provided containing all 3, we display it prominently -->
<div class="col-span-3 relative h-full">
<img alt="Almuerzos Caseros Food Gallery" class="w-full h-full object-cover object-top" data-purpose="main-banner-image" src="https://lh3.googleusercontent.com/aida/ADBb0ugb9X9-LWUn8anuVHrkTlJIOTeHfJieHir67Jo31BwOlDGKHkb-w89GYR1c9v5NzpA3ZcC0G_P8hkINpjoA1YZ0Htcs6EOIa2B0xElEtlefPC2k4Gywsk7510GTd7KFosFX6MywAeUYIf1nqUMyhLs31wcEPcKrQrBMiaouSoPCLRkivVI2vamYaHxZENqmIZUTItRHsy-f4u_N2NusDYxhJXqT47QG_vhBV0yMDYw64BJLPqGd4IHQeicPsniviBgI8QJ1EC2r"/>
<!-- Overlay to smooth the transition to the title section -->
<div class="absolute bottom-0 left-0 w-full h-12 bg-gradient-to-t from-[#f4eee1] to-transparent"></div>
</div>
</div>
</header>
<!-- END: Hero Image Gallery -->
<!-- BEGIN: Main Title Section -->
<main class="px-6 py-8 text-center" data-purpose="main-content">
<div class="mb-8">
<h1 class="font-serif-bold text-6xl leading-none text-brand-brown title-shadow mb-0">
        Almuerzos
      </h1>
<h2 class="font-serif-bold text-6xl leading-none text-brand-orange title-shadow mt-[-5px]">
        caseros
      </h2>
<p class="mt-6 text-lg font-bold italic text-brand-brown opacity-90">
        Todos los días tenemos un menú diferente
      </p>
</div>
<!-- END: Main Title Section -->
<!-- BEGIN: Schedule Section -->
<section class="mb-10" data-purpose="horario-section">
<h3 class="font-serif-bold text-3xl text-brand-orange mb-4">Horario</h3>
<!-- Monday to Friday -->
<div class="max-w-xs mx-auto mb-4" data-purpose="schedule-card-weekday">
<div class="bg-brand-brown text-white rounded-full py-2 px-6 font-bold text-xl shadow-md">
          Lunes a viernes
        </div>
<p class="mt-2 text-lg font-bold">De 11:00 a.m. a 2:00 p.m.</p>
</div>
<!-- Saturday -->
<div class="max-w-xs mx-auto" data-purpose="schedule-card-weekend">
<div class="bg-brand-brown text-white rounded-full py-2 px-6 font-bold text-xl shadow-md">
          Sábados
        </div>
<p class="mt-2 text-lg font-bold">De 11:00 a.m. a 4:00 p.m.</p>
</div>
</section>
<!-- END: Schedule Section -->
<!-- BEGIN: CTA Section -->
<section class="bg-brand-orange text-white rounded-3xl p-8 shadow-xl max-w-sm mx-auto mb-12" data-purpose="cta-section">
<h3 class="font-serif-bold text-2xl mb-6">Realiza tu pedido:</h3>
<div class="flex flex-col gap-6 items-start text-left">
<!-- Phone Link -->
<a class="flex items-center gap-4 group" data-purpose="phone-cta" href="tel:3162123456">
<div class="bg-brand-brown p-3 rounded-full group-active:scale-95 transition-transform">
<svg class="h-6 w-6 fill-white" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M6.62 10.79a15.15 15.15 0 006.59 6.59l2.2-2.2a1 1 0 011.11-.27 11.72 11.72 0 003.7.59 1 1 0 011 1V20a1 1 0 01-1 1A19 19 0 013 4a1 1 0 011-1h3.41a1 1 0 011 1 11.72 11.72 0 00.59 3.7 1 1 0 01-.27 1.11z"></path>
</svg>
</div>
<span class="text-xl font-bold">(316) 212-3456</span>
</a>
<!-- Address -->
<div class="flex items-start gap-4" data-purpose="address-info">
<div class="bg-brand-brown p-3 rounded-full mt-1">
<svg class="h-6 w-6 fill-white" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 110-5 2.5 2.5 0 010 5z"></path>
</svg>
</div>
<span class="text-lg font-semibold leading-tight">
            Calle Cualquiera 123,<br/>Cualquier Lugar
          </span>
</div>
</div>
</section>
<!-- END: CTA Section -->
</main>
<!-- BEGIN: Footer -->
<footer class="pb-12 text-center text-brand-brown opacity-60 text-sm">
<p>© 2023 Almuerzos Caseros. Sabor de hogar.</p>
</footer>
<!-- END: Footer -->
</body></html>
